spring.application.name=backend
# File-based H2: data survives a restart. Stored in backend/data/ (relative to where the app runs).
spring.datasource.url=jdbc:h2:file:./data/expiry-tracker
spring.datasource.username=sa
spring.datasource.password=
# Hibernate only checks that the entities match schema.sql; it never changes the tables.
spring.jpa.hibernate.ddl-auto=validate
# Run schema.sql on every start, also for a file DB (default "embedded" skips it). IF NOT EXISTS keeps existing data.
spring.sql.init.mode=always
spring.jackson.deserialization.accept-float-as-int=false
