# Prod profile (cloud): persistent PostgreSQL (Neon). Values come only from environment variables.
# No defaults on purpose: if a variable is missing, startup fails instead of silently falling back to H2.
# No sample data: spring.sql.init.data-locations is not set here.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
