version: 2

# Dependabot opens a pull request when a newer version exists.
# Every one of those PRs goes through the same CI checks as your own changes.
#
# Groups: minor and patch updates (low risk) arrive together as ONE pull request
# per ecosystem, so they cannot conflict with each other in package-lock.json.
# Major updates are not in a group on purpose: each one gets its own PR to review.
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Keeps the commit-hash pins in .github/workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
