name: CI

# Run on every pull request, and on every push to main (after a merge).
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow can only read the repository.
permissions:
  contents: read

# If a new commit is pushed to the same PR, cancel the older run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven # keeps downloaded libraries between runs, so it is faster
      # mvnw was added to git from Windows, so it is not marked executable.
      # Linux needs the flag (the Dockerfile does the same).
      - name: Make mvnw executable
        run: chmod +x mvnw
      - name: Run tests
        run: ./mvnw test

  frontend:
    name: Frontend lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci # installs exactly what package-lock.json says
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Backend Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build image
        run: docker build backend
